name: Build Guide AI APK

on:
  workflow_dispatch:
    inputs:
      guide_api_url:
        description: "Deployed Guide AI API URL"
        required: true
        type: string
  push:
    paths:
      - "android-guide-ai/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-guide-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug -PguideApiUrl="${{ inputs.guide_api_url || 'https://YOUR-VERCEL-DOMAIN.vercel.app/api/guide' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-ai-debug-apk
          path: android-guide-ai/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
