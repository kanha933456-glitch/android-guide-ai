name: Build Guide AI APK

on:
  workflow_dispatch:
    inputs:
      guide_api_url:
        description: "Deployed Guide AI API URL"
        required: true
        type: string
  push:
    paths:
      - "android-guide-ai/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-guide-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease -PguideApiUrl="${{ inputs.guide_api_url || 'https://android-guide-ai.vercel.app/api/guide' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guide-ai-release-apk
          path: android-guide-ai/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
